<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impressum – {{brandName}}</title>
    <meta name="theme-color" content="#f8f1e4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    {{{canonical}}}
    <link rel="stylesheet" href="/src/landing/landing.css" />
  </head>
  <body>
    <a class="skip" href="#inhalt">Zum Inhalt springen</a>
    <header class="top">
      <div class="wrap top__inner">
        <a class="logo" href="./">
          <svg viewBox="0 0 64 44" aria-hidden="true">
            <rect x="1.5" y="1.5" width="61" height="41" rx="5" fill="#e9dcc7" stroke="#7d6c5c" stroke-width="2" />
            <rect x="7" y="6" width="50" height="22" rx="3" fill="#fffcf6" />
            <rect x="7" y="6" width="50" height="4.5" rx="2" fill="#b44a0e" />
            <rect x="15" y="15" width="34" height="10" rx="5" fill="#4a3b31" />
            <path d="M16 42.5l4-8h24l4 8z" fill="#b9a68e" />
          </svg>
          <span>{{brandName}}</span>
        </a>
        <a class="btn btn--primary btn--sm" href="app/#/auftrag">Anfragen</a>
      </div>
    </header>
    <main id="inhalt" class="legal">
      <div class="wrap">
        <a class="back" href="./">← Zur Startseite</a>
        <h1>Impressum</h1>
        <p>Informationen nach § 5 E-Commerce-Gesetz und Offenlegung nach § 25 Mediengesetz.</p>
        <dl>
{{{imprint}}}
        </dl>
      </div>
    </main>
    <footer class="foot">
      <div class="wrap foot__inner">
        <div>
          <p class="foot__brand">{{brandName}}</p>
          <p>Ein Angebot von {{companyName}}</p>
        </div>
        <ul class="foot__links">
          <li><a href="./">Startseite</a></li>
          <li><a href="app/">Kostenlose App</a></li>
          <li><a href="impressum.html">Impressum</a></li>
          <li><a href="datenschutz.html">Datenschutz</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
