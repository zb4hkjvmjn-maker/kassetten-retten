<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kassetten retten: Alte Audio- und Videokassetten ordnen und die Digitalisierung Schritt für Schritt planen. Deine Erinnerungen verdienen eine Zukunft." />
    <meta name="theme-color" content="#faf4e8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="robots" content="noindex" />
    <title>Meine Sammlung – Kassetten retten</title>
    <script>
      // Gewählte Ansicht sofort anwenden, damit die Seite nicht kurz im falschen Stil erscheint.
      try {
        var a = JSON.parse(localStorage.getItem('kassetten-retten:darstellung') || '{}');
        if (a.stil === 'modern') document.documentElement.dataset.stil = 'modern';
        if (a.schrift === 'gross' || a.schrift === 'sehr-gross') document.documentElement.dataset.schrift = a.schrift;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Bitte aktiviere JavaScript, um „Kassetten retten“ zu verwenden.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
